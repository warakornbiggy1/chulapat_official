<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true" focusable="false">
  <!-- CHULAPAT_OFFICIAL — Dark Circus sport medallion: Basketball.
       Monoline, 64-grid, optical diameter 42. The two side seams start and end
       on the rim at the 45° points and bow inward. Running them pole-to-pole
       instead would converge like longitude lines and read as a globe.
       Drop a real emblem over this file to swap it without touching markup. -->
  <g fill="none" stroke="#E8B96A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="21"/>
    <path d="M32 11v42"/>
    <path d="M11 32h42"/>
    <path d="M17.2 17.2c6 4 6 25.6 0 29.6"/>
    <path d="M46.8 17.2c-6 4-6 25.6 0 29.6"/>
  </g>
</svg>
